name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            command: npm run dist
          - os: macos-14
            name: macos-arm64
            command: npm run dist:mac
          - os: ubuntu-22.04
            name: linux-x64
            command: npx electron-builder --linux dir --x64 && python3 scripts/make-deb.py

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: ${{ matrix.command }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: DgxayCode-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
          if-no-files-found: error
