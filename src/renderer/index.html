<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:;" />
  <title>DgxayChatBox</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-accent="blue">
  <div class="app" id="app">
    <header class="titlebar">
      <div class="tb-brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#2563EB" />
          <path d="M9.4 10.4h13.2a2.4 2.4 0 0 1 2.4 2.4v5.8a2.4 2.4 0 0 1-2.4 2.4h-5.8l-3.6 2.9c-.7.6-1.8.1-1.8-.8v-2.1H9.4a2.4 2.4 0 0 1-2.4-2.4v-5.8a2.4 2.4 0 0 1 2.4-2.4Z" fill="#fff" />
          <circle cx="12.6" cy="15.7" r="1.15" fill="#2563EB" />
          <circle cx="16.6" cy="15.7" r="1.15" fill="#2563EB" />
          <circle cx="20.6" cy="15.7" r="1.15" fill="#2563EB" />
        </svg>
        <span class="tb-name">DgxayChatBox</span>
      </div>
      <div class="tb-drag"></div>
      <div class="tb-controls" id="winControls">
        <button class="win-btn" id="winMin" title="最小化" aria-label="最小化">
          <svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /></svg>
        </button>
        <button class="win-btn" id="winMax" title="最大化" aria-label="最大化">
          <svg viewBox="0 0 12 12"><rect x="2.4" y="2.4" width="7.2" height="7.2" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.2" /></svg>
        </button>
        <button class="win-btn danger" id="winClose" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /></svg>
        </button>
      </div>
    </header>

    <div class="workspace" id="workspace">
      <aside class="sidebar">
        <button class="new-chat" id="btnNewChat">
          <span class="nc-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14" /></svg>
          </span>
          <span class="nc-label">新建对话</span>
          <kbd id="kbdNewChat">Ctrl N</kbd>
        </button>

        <div class="side-heading"><span>对话</span><span class="side-count" id="chatCount"></span></div>
        <div class="chat-list" id="chatList"></div>
        <div class="side-empty" id="sideEmpty" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v6a2.5 2.5 0 0 1-2.5 2.5H9.8L5 18.4V6.5Z" /></svg>
          <p>还没有对话</p>
          <span>从上面的「新建对话」开始</span>
        </div>

        <div class="side-footer">
          <div class="mode-switch" id="modeSwitch" role="tablist" aria-label="工作模式">
            <button type="button" data-mode="chat" class="active" role="tab" aria-selected="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v6a2.5 2.5 0 0 1-2.5 2.5H9.8L5 18.4V6.5Z" /></svg>
              对话
            </button>
            <button type="button" data-mode="work" role="tab" aria-selected="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6H10l2 2h5.5A2.5 2.5 0 0 1 20 10.5v7A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5v-9Z" /></svg>
              工作
            </button>
          </div>
          <button class="side-link" id="btnSettings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" /></svg>
            设置
            <kbd id="kbdSettings">Ctrl ,</kbd>
          </button>
        </div>
      </aside>

      <main class="main">
        <section class="chat-view" id="chatView">
          <header class="chat-head">
            <div class="ch-left">
              <span class="mode-chip" id="modeChip" data-mode="chat">对话</span>
              <button class="icon-btn" id="btnOpenWorkspace" title="打开工作空间" aria-label="打开工作空间" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6H10l2 2h5.5A2.5 2.5 0 0 1 20 10.5v7A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5v-9Z" /></svg>
              </button>
            </div>
            <div class="ch-center">
              <h2 id="chatTitle">新对话</h2>
              <div class="ch-meta" id="chatMeta"></div>
            </div>
            <div class="ch-right">
              <button class="icon-btn" id="btnHeaderSettings" title="设置" aria-label="设置">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" /></svg>
              </button>
            </div>
          </header>

          <div class="messages" id="messages"></div>

          <div class="composer-zone">
            <div class="composer" id="composer">
              <div class="composer-top" id="composerTop" hidden></div>
              <textarea id="input" rows="1" placeholder="给 DgxayChatBox 发送消息"></textarea>
              <div class="composer-toolbar">
                <div class="ct-left">
                  <button class="tool-pill" id="modeHintBtn" title="切换对话 / 工作模式">
                    <span class="dot" id="modeHintDot"></span>
                    <span id="modeHintText">对话模式</span>
                  </button>
                  <button class="skill-chip" id="skillChip" hidden title="本对话启用的技能，点击移除">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l1.8 5.2 5.2 1.8-5.2 1.8L12 17.5l-1.8-5.2L5 10.5l5.2-1.8L12 3.5Z" /></svg>
                    <span id="skillChipName"></span>
                    <span class="sc-x">×</span>
                  </button>
                </div>
                <div class="ct-right">
                  <button class="ctx-ring" id="ctxRing" title="上下文用量" aria-label="上下文用量">
                    <svg viewBox="0 0 24 24">
                      <circle class="ring-track" cx="12" cy="12" r="8.5" />
                      <circle class="ring-progress" id="ctxRingProgress" cx="12" cy="12" r="8.5" />
                    </svg>
                  </button>
                  <button class="model-pill" id="modelBtn" title="选择模型">
                    <span class="mp-dot"></span>
                    <span class="mp-name" id="modelBtnName">选择模型</span>
                    <svg class="mp-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5 5 5-5" /></svg>
                  </button>
                  <button class="send-btn" id="sendBtn" title="发送" aria-label="发送">
                    <svg class="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M12 5l-6 6M12 5l6 6" /></svg>
                    <svg class="i-stop" viewBox="0 0 24 24" hidden><rect x="7.5" y="7.5" width="9" height="9" rx="2" fill="currentColor" /></svg>
                  </button>
                </div>
              </div>
            </div>

            <div class="work-bar" id="workBar" hidden>
              <div class="wb-group wb-workspace">
                <span class="wb-label">工作空间</span>
                <div class="ws-list" id="wsList"></div>
                <button class="ws-add" id="wsAdd">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
                  选择文件夹
                </button>
              </div>
              <div class="wb-group wb-permission">
                <span class="wb-label">权限</span>
                <div class="perm-list" id="permList" role="radiogroup" aria-label="权限模式"></div>
              </div>
            </div>

            <div class="composer-foot">
              <span id="footHint">Enter 发送 · Shift + Enter 换行 · / 命令 · ! 终端</span>
              <span class="foot-right" id="footModel"></span>
            </div>
          </div>
        </section>

        <section class="settings-view" id="settingsView" hidden>
          <div class="set-side">
            <button class="set-back" id="setBack">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6" /></svg>
              返回对话
            </button>
            <nav class="set-nav" id="setNav">
              <button data-tab="providers" class="active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h7" /></svg>
                供应商与模型
              </button>
              <button data-tab="oauth">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1L10.5 5.4" /><path d="M14 11a5 5 0 0 0-7.1 0l-2 2A5 5 0 0 0 12 20.1l1.5-1.5" /></svg>
                账户连接
              </button>
              <button data-tab="shortcuts">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="2.5" /><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h8" /></svg>
                快捷键
              </button>
              <button data-tab="mcp">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 7V4.5M15 7V4.5" /><rect x="5" y="7" width="14" height="12" rx="3" /><path d="M9.5 12h5M12 9.5v5" /></svg>
                MCP
              </button>
              <button data-tab="general">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" /><circle cx="15" cy="7" r="2.2" /><circle cx="8" cy="17" r="2.2" /></svg>
                通用
              </button>
              <button data-tab="data">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="12" cy="6" rx="7" ry="3" /><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6" /><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3" /></svg>
                数据与关于
              </button>
            </nav>
            <div class="set-side-foot">DgxayChatBox <span id="setVersion">V1.1</span></div>
          </div>
          <div class="set-main">
            <header class="set-head">
              <h1 id="setTitle">供应商与模型</h1>
              <p id="setDesc"></p>
            </header>
            <div class="set-body" id="setBody"></div>
          </div>
        </section>
      </main>
    </div>

    <div class="onboard" id="onboard" hidden>
      <div class="ob-wrap">
        <div class="ob-main">
          <div class="ob-brand">
            <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
              <rect width="32" height="32" rx="8" fill="#2563EB" />
              <path d="M9.4 10.4h13.2a2.4 2.4 0 0 1 2.4 2.4v5.8a2.4 2.4 0 0 1-2.4 2.4h-5.8l-3.6 2.9c-.7.6-1.8.1-1.8-.8v-2.1H9.4a2.4 2.4 0 0 1-2.4-2.4v-5.8a2.4 2.4 0 0 1 2.4-2.4Z" fill="#fff" />
              <circle cx="12.6" cy="15.7" r="1.15" fill="#2563EB" />
              <circle cx="16.6" cy="15.7" r="1.15" fill="#2563EB" />
              <circle cx="20.6" cy="15.7" r="1.15" fill="#2563EB" />
            </svg>
            <span>DgxayChatBox</span>
          </div>
          <div class="ob-steps" id="obSteps"><i class="active"></i><i></i></div>
          <div class="ob-body" id="obBody"></div>
          <div class="ob-foot" id="obFoot"></div>
          <p class="ob-legal">配置保存在本机 <code>~/.dcb/config.json</code>，密钥不会上传。</p>
        </div>
      </div>
    </div>

    <div class="slash-menu" id="slashMenu" hidden></div>
    <div class="menu-layer" id="menuLayer"></div>
    <div class="modal-layer" id="modalLayer" hidden></div>
    <div class="toast-layer" id="toastLayer"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
